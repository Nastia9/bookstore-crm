<div class="card">
  <div class="card__image"></div>
  <div class="card__body">
    <h3 class="card__title">{{ book.title }}</h3>
    <p class="card__author">{{ authorFullName }}</p>
    <div class="card__footer">
      <div class="card__price">{{ book.price }} ₴</div>
       <button
        class="card__button"
        [disabled]="book.stock === 0"
        (click)="addToCart()"
        aria-label="До кошика"
      >
        До кошика
      </button>
    </div>
  </div>
</div>
