<div class="users-page">
  <div class="users-page__header">
    <h1>Користувачі</h1>
    <button mat-flat-button color="primary" (click)="openAddUserDialog()">
      <mat-icon>library_add</mat-icon>
      Створити
    </button>
  </div>
  <div class="filters-row">
    <mat-form-field appearance="outline" class="filter-item">
      <mat-label>Пошук користувачів</mat-label>
      <input
        matInput
        placeholder="Введіть текст..."
        [(ngModel)]="searchText"
        (ngModelChange)="onFilterChange()"
      />
    </mat-form-field>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="filteredUsers()" class="mat-elevation-z2">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Прізвище та ім'я </th>
        <td mat-cell *matCellDef="let u"> {{ u.lastName }} {{ u.firstName }} </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let u"> {{ u.email }} </td>
      </ng-container>

      <ng-container matColumnDef="phoneNumber">
        <th mat-header-cell *matHeaderCellDef> Номер телефону </th>
        <td mat-cell *matCellDef="let u"> {{ u.phoneNumber }} </td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef> Роль </th>
        <td mat-cell *matCellDef="let u">
          <span class="role-badge" [ngClass]="u.role">
            {{
              u.role === 'admin'
                ? 'Адміністратор'
                : u.role === 'customer'
                ? 'Клієнт'
                : 'Менеджер'
            }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Дії </th>
        <td mat-cell *matCellDef="let u">
          <button
            mat-icon-button
            color="primary"
            matTooltip="Редагувати"
            (click)="openEditUserDialog(u)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            matTooltip="Видалити"
            (click)="deleteUser(u.id)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
