 <h2 mat-dialog-title>Додати нову категорію</h2>
    <form [formGroup]="form" (ngSubmit)="onCreate()" class="dialog-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Назва категорії</mat-label>
        <input matInput formControlName="name" />
        <mat-error *ngIf="form.get('name')?.hasError('required')">
          Поле «Назва» обов’язкове
        </mat-error>
      </mat-form-field>

      <div class="actions">
        <button mat-stroked-button mat-dialog-close color="warn">Відмінити</button>
        <button mat-flat-button color="primary" [disabled]="form.invalid">
          Додати
        </button>
      </div>
    </form>
