name: Deploy Backend to Azure

on:
  push:
    branches:
      - feature/add-frontend-part

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build and Push Docker image to ACR
      uses: azure/docker-login@v1
      with:
        login-server: bookstoreappregistry.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push image
      run: |
          docker build -f backend/BookStore/dockerfile -t bookstoreappregistry.azurecr.io/bookstore-api:latest .
          docker push bookstoreappregistry.azurecr.io/bookstore-api:latest

    - name: Deploy to App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: bookstore-api
        images: 'bookstoreappregistry.azurecr.io/bookstore-api:latest'
